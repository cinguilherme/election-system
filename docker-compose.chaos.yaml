# Opt-in overlay that turns on the internal chaos admin plane.
#
# WHY THIS IS SEPARATE
# --------------------
# Chaos is a fault injector. It must never be reachable in the default stack, and
# the base compose file must stay free of any switch that could enable it by
# accident. This overlay is the single place where CHAOS_ENABLED=1 is set; the
# image itself ships the code inert (see docs/resilience-roadmap.md, item 1).
#
# The admin port is deliberately NOT published to the host:
#   * with `deploy.replicas` a fixed host port cannot be assigned per replica;
#   * the public entrypoint is `election-api` (nginx), which must never proxy it.
# Reach it from inside the compose network (the chaos-engine of item 3) or with
#   docker compose exec <container> sh -c 'curl -s -H "X-Chaos-Token: $CHAOS_ADMIN_TOKEN" http://127.0.0.1:8082/_chaos/status'
#
# USAGE
# -----
#   export CHAOS_TOKEN=$(openssl rand -hex 16)     # required, fail-closed
#   make chaos-up
#   make chaos-status
#   make chaos-down
#
# To go back to the default (no chaos, no admin port):
#   docker compose -f docker-compose.yaml -f docker-compose.observability.yaml up -d
#
# CHAOS_JOURNAL_MODE:
#   full  record every instrumented operation with bounded payloads (default)
#   meta  record identity/shape only -- no payloads, no results
#   off   inject faults, record nothing (lowest overhead, for long load+chaos runs)
# CHAOS_SAMPLE keeps a fraction of events (1.0 = all); CHAOS_MAX_PAYLOAD_CHARS
# replaces anything larger with an {:omitted-bytes n} marker.
#
# CHAOS_ALLOWED_COMPONENTS narrows what a rule may target; a component outside the
# list is rejected with 422 instead of armed. CHAOS_MAX_TOTAL_HITS is the blast
# radius: when the node has injected that many faults it disables itself.
#
# The chaos-engine (below) is the only component that talks to the admin ports:
# it resolves a service to its replicas over the compose network, so the nodes never
# publish 8082 and the operator never addresses a container by name.
services:
  # One proxy per dependency edge, so a fault can be aimed at "actors -> postgres"
  # without touching "api -> postgres". The tiers are pointed at these listeners by
  # the environment overrides below; without a toxic they are a plain TCP relay.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: ["-host", "0.0.0.0", "-config", "/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      # Management API: useful for poking at proxies by hand.
      - "8474:8474"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8474/version"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The only component with access to the docker socket. It is a narrow TCP view of
  # the API (containers + POST), so the engine can pause/kill without mounting the
  # socket itself.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2
    environment:
      CONTAINERS: "1"
      POST: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  chaos-engine:
    image: ${REGISTRY:?set REGISTRY in .env -- the LAN address of the registry host, e.g. 192.168.15.29:5001}/election-system-chaos-engine:${TAG:-latest}
    build:
      context: ..
      dockerfile: d-core-chaos-engine/Dockerfile
      provenance: false
    ports:
      # Operator-facing API. Token-guarded; this is the surface you curl.
      - "8088:8088"
    environment:
      # Service DNS expands to every replica IP, so `replica: 2` means the second
      # container of the service, not "whichever one answered".
      CHAOS_TARGETS: "election-actors:8082,election-api-backend:8082"
      CHAOS_ENGINE_PORT: "8088"
      CHAOS_TOKEN: "${CHAOS_TOKEN:?set CHAOS_TOKEN (any random string) before using the chaos overlay}"
      CHAOS_REFRESH_MS: "${CHAOS_REFRESH_MS:-10000}"
      CHAOS_TIMEOUT_MS: "${CHAOS_TIMEOUT_MS:-2000}"
      CHAOS_ALLOWED_COMPONENTS: "${CHAOS_ALLOWED_COMPONENTS:-db,actor-transport,actor-client,actor-delivery,actor-effect,snapshot,lease,circuit-breaker}"
      # Scenarios are deployment configuration: mounted, not baked into the image.
      CHAOS_SCENARIOS_DIR: "/workspace/scenarios"
      CHAOS_REPORTS_DIR: "/workspace/reports"
      CHAOS_PROMETHEUS_URL: "http://prometheus:9090"
      CHAOS_TOXIPROXY_URL: "http://toxiproxy:8474"
      CHAOS_DOCKER_URL: "http://docker-socket-proxy:2375"
      GRAFANA_URL: "${GRAFANA_URL:-http://grafana:3000}"
    volumes:
      - ./scenarios:/workspace/scenarios:ro
      - chaos-reports:/workspace/reports
    depends_on:
      - election-actors
      - election-api-backend
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  election-actors:
    environment:
      # Every dependency the actors own goes through its own proxy.
      JDBC_URL: "jdbc:postgresql://toxiproxy:15433/election_db"
      ASYNC_PROXY_HOST: "toxiproxy"
      ASYNC_PROXY_GRPC_PORT: "15052"
      VALKEY_URI: "redis://toxiproxy:16379"
      CHAOS_ENABLED: "1"
      CHAOS_ADMIN_PORT: "8082"
      CHAOS_ADMIN_TOKEN: "${CHAOS_TOKEN:?set CHAOS_TOKEN (any random string) before using the chaos overlay}"
      CHAOS_JOURNAL_MODE: "${CHAOS_JOURNAL_MODE:-full}"
      CHAOS_MAX_EVENTS: "${CHAOS_MAX_EVENTS:-50000}"
      CHAOS_SAMPLE: "${CHAOS_SAMPLE:-1.0}"
      CHAOS_MAX_PAYLOAD_CHARS: "${CHAOS_MAX_PAYLOAD_CHARS:-4000}"
      CHAOS_ALLOWED_COMPONENTS: "${CHAOS_ALLOWED_COMPONENTS:-db,actor-transport,actor-client,actor-delivery,actor-effect,snapshot,lease,circuit-breaker}"
      CHAOS_MAX_TOTAL_HITS: "${CHAOS_MAX_TOTAL_HITS:-100000}"
    expose:
      - "8082"

  election-api-backend:
    environment:
      JDBC_URL: "jdbc:postgresql://toxiproxy:15432/election_db"
      ASYNC_PROXY_HOST: "toxiproxy"
      ASYNC_PROXY_GRPC_PORT: "15051"
      CHAOS_ENABLED: "1"
      CHAOS_ADMIN_PORT: "8082"
      CHAOS_ADMIN_TOKEN: "${CHAOS_TOKEN:?set CHAOS_TOKEN (any random string) before using the chaos overlay}"
      CHAOS_JOURNAL_MODE: "${CHAOS_JOURNAL_MODE:-full}"
      CHAOS_MAX_EVENTS: "${CHAOS_MAX_EVENTS:-50000}"
      CHAOS_SAMPLE: "${CHAOS_SAMPLE:-1.0}"
      CHAOS_MAX_PAYLOAD_CHARS: "${CHAOS_MAX_PAYLOAD_CHARS:-4000}"
      CHAOS_ALLOWED_COMPONENTS: "${CHAOS_ALLOWED_COMPONENTS:-db,actor-transport,actor-client,actor-delivery,actor-effect,snapshot,lease,circuit-breaker}"
      CHAOS_MAX_TOTAL_HITS: "${CHAOS_MAX_TOTAL_HITS:-100000}"
    expose:
      - "8082"

  # The control room. The only browser-facing service of the chaos plane, and the only
  # component that holds CHAOS_TOKEN: the browser gets a session cookie, never the token.
  # Published on loopback only -- same posture as the rest of this overlay.
  chaos-cockpit:
    image: ${REGISTRY:?set REGISTRY in .env -- the LAN address of the registry host, e.g. 192.168.15.29:5001}/election-system-chaos-cockpit:${TAG:-latest}
    build:
      context: ../d-core-chaos-cockpit
      dockerfile: Dockerfile
      provenance: false
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      CHAOS_ENGINE_URL: "http://chaos-engine:8088"
      CHAOS_TOKEN: "${CHAOS_TOKEN:?set CHAOS_TOKEN (any random string) before using the chaos overlay}"
      COCKPIT_OPERATORS: "${COCKPIT_OPERATORS:-}"
      COCKPIT_SESSION_SECRET: "${COCKPIT_SESSION_SECRET:?set COCKPIT_SESSION_SECRET (>= 16 chars)}"
      COCKPIT_DB: "/data/cockpit.db"
      COCKPIT_TTL_DEFAULT_MS: "${COCKPIT_TTL_DEFAULT_MS:-300000}"
      COCKPIT_TTL_MAX_MS: "${COCKPIT_TTL_MAX_MS:-1800000}"
    volumes:
      - cockpit-data:/data
    depends_on:
      - chaos-engine
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8090/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chaos-reports:
  cockpit-data:
