services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: election
      POSTGRES_PASSWORD: election
      POSTGRES_DB: election_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U election -d election_db"]
      interval: 2s
      timeout: 3s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  async-proxy-ingress:
    build:
      context: ..
      dockerfile: d-core-async-proxy/Dockerfile
    environment:
      PORT: "4000"
      GRPC_PORT: "50051"
      BROKER_BACKEND: "jetstream"
      NATS_URL: "nats://nats:4222"
      OTEL_SERVICE_NAME: "async-proxy-ingress"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
      OTEL_SAMPLING_RATIO: "0.10"
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=1 -XX:MaxRAMPercentage=75.0"
    ports:
      - "4000:4000"
      - "50051:50051"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4000 && exec 4<>/dev/tcp/127.0.0.1/50051"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      - nats
      - jaeger
    cap_add:
      - SYS_PTRACE
      # PERFMON is required for `asprof -e cpu` (perf_events sampling).
      # Without it perf_event_open fails with EPERM and async-profiler has to
      # fall back to ctimer/itimer, which under-samples worker threads.
      - PERFMON
    deploy:
      resources:
        limits:
          cpus: "0.60"
          memory: 1024M

  async-proxy-egress:
    build:
      context: ..
      dockerfile: d-core-async-proxy/Dockerfile
    environment:
      PORT: "4001"
      GRPC_PORT: "50052"
      BROKER_BACKEND: "jetstream"
      NATS_URL: "nats://nats:4222"
      OTEL_SERVICE_NAME: "async-proxy-egress"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
      OTEL_SAMPLING_RATIO: "0.10"
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=1 -XX:MaxRAMPercentage=75.0"
    ports:
      - "4001:4001"
      - "50052:50052"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4001 && exec 4<>/dev/tcp/127.0.0.1/50052"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      - nats
      - jaeger
    cap_add:
      - SYS_PTRACE
      # PERFMON is required for `asprof -e cpu` (perf_events sampling).
      # Without it perf_event_open fails with EPERM and async-profiler has to
      # fall back to ctimer/itimer, which under-samples worker threads.
      - PERFMON
    deploy:
      resources:
        limits:
          cpus: "0.60"
          memory: 1024M

  election-actors-1:
    build:
      context: ..
      dockerfile: election-system/Dockerfile
    environment:
      ROLE: "actors"
      METRICS_PORT: "8081"
      ASYNC_PROXY_HOST: "async-proxy-egress"
      ASYNC_PROXY_GRPC_PORT: "50052"
      ASSIGNED_PARTITIONS: "0,1,2,3"
      TOTAL_PARTITIONS: "8"
      WORKER_COUNT: "4"
      BATCH_SIZE: "50"
      FLUSH_EVERY_N: "25"
      TICK_INTERVAL_MS: "2000"
      ELECTION_ID: "national-2026"
      DB_ENGINE: "postgres"
      JDBC_URL: "jdbc:postgresql://postgres:5432/election_db"
      DB_USER: "election"
      DB_PASSWORD: "election"
      DB_POOL_SIZE: "4"
      OTEL_SERVICE_NAME: "election-actors"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
      OTEL_SAMPLING_RATIO: "0.10"
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=1 -XX:MaxRAMPercentage=75.0"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      async-proxy-egress:
        condition: service_healthy
      jaeger:
        condition: service_started
    cap_add:
      - SYS_PTRACE
      # PERFMON is required for `asprof -e cpu` (perf_events sampling).
      # Without it perf_event_open fails with EPERM and async-profiler has to
      # fall back to ctimer/itimer, which under-samples worker threads.
      - PERFMON
    deploy:
      resources:
        limits:
          cpus: "0.90"
          memory: 1536M

  election-actors-2:
    build:
      context: ..
      dockerfile: election-system/Dockerfile
    environment:
      ROLE: "actors"
      METRICS_PORT: "8082"
      ASYNC_PROXY_HOST: "async-proxy-egress"
      ASYNC_PROXY_GRPC_PORT: "50052"
      ASSIGNED_PARTITIONS: "4,5,6,7"
      TOTAL_PARTITIONS: "8"
      WORKER_COUNT: "4"
      BATCH_SIZE: "50"
      FLUSH_EVERY_N: "25"
      TICK_INTERVAL_MS: "2000"
      ELECTION_ID: "national-2026"
      DB_ENGINE: "postgres"
      JDBC_URL: "jdbc:postgresql://postgres:5432/election_db"
      DB_USER: "election"
      DB_PASSWORD: "election"
      DB_POOL_SIZE: "4"
      OTEL_SERVICE_NAME: "election-actors"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
      OTEL_SAMPLING_RATIO: "0.10"
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=1 -XX:MaxRAMPercentage=75.0"
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      async-proxy-egress:
        condition: service_healthy
      jaeger:
        condition: service_started
    cap_add:
      - SYS_PTRACE
      # PERFMON is required for `asprof -e cpu` (perf_events sampling).
      # Without it perf_event_open fails with EPERM and async-profiler has to
      # fall back to ctimer/itimer, which under-samples worker threads.
      - PERFMON
    deploy:
      resources:
        limits:
          cpus: "0.90"
          memory: 1536M

  election-api-1:
    build:
      context: ..
      dockerfile: election-system/Dockerfile
    environment:
      ROLE: "api"
      HTTP_PORT: "8080"
      ASYNC_PROXY_HOST: "async-proxy-ingress"
      ASYNC_PROXY_GRPC_PORT: "50051"
      WORKER_COUNT: "8"
      TOTAL_PARTITIONS: "8"
      DB_ENGINE: "postgres"
      JDBC_URL: "jdbc:postgresql://postgres:5432/election_db"
      DB_USER: "election"
      DB_PASSWORD: "election"
      DB_POOL_SIZE: "8"
      JETTY_MAX_THREADS: "120"
      OTEL_SERVICE_NAME: "election-api-1"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
      OTEL_SAMPLING_RATIO: "0.10"
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=1 -XX:MaxRAMPercentage=75.0"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      async-proxy-ingress:
        condition: service_healthy
      election-actors-1:
        condition: service_healthy
      election-actors-2:
        condition: service_healthy
      jaeger:
        condition: service_started
    cap_add:
      - SYS_PTRACE
      # PERFMON is required for `asprof -e cpu` (perf_events sampling).
      # Without it perf_event_open fails with EPERM and async-profiler has to
      # fall back to ctimer/itimer, which under-samples worker threads.
      - PERFMON
    deploy:
      resources:
        limits:
          cpus: "0.90"
          memory: 1536M

  election-api-2:
    build:
      context: ..
      dockerfile: election-system/Dockerfile
    environment:
      ROLE: "api"
      HTTP_PORT: "8080"
      ASYNC_PROXY_HOST: "async-proxy-ingress"
      ASYNC_PROXY_GRPC_PORT: "50051"
      WORKER_COUNT: "8"
      TOTAL_PARTITIONS: "8"
      DB_ENGINE: "postgres"
      JDBC_URL: "jdbc:postgresql://postgres:5432/election_db"
      DB_USER: "election"
      DB_PASSWORD: "election"
      DB_POOL_SIZE: "8"
      JETTY_MAX_THREADS: "120"
      OTEL_SERVICE_NAME: "election-api-2"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
      OTEL_SAMPLING_RATIO: "0.10"
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=1 -XX:MaxRAMPercentage=75.0"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      async-proxy-ingress:
        condition: service_healthy
      election-actors-1:
        condition: service_healthy
      election-actors-2:
        condition: service_healthy
      jaeger:
        condition: service_started
    cap_add:
      - SYS_PTRACE
      # PERFMON is required for `asprof -e cpu` (perf_events sampling).
      # Without it perf_event_open fails with EPERM and async-profiler has to
      # fall back to ctimer/itimer, which under-samples worker threads.
      - PERFMON
    deploy:
      resources:
        limits:
          cpus: "0.90"
          memory: 1536M

  election-api:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      election-api-1:
        condition: service_healthy
      election-api-2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - MEMORY_MAX_TRACES=5000
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 512M

  # Container-level resource telemetry. Without this, Prometheus only sees the
  # six application /metrics endpoints, so cgroup CPU quota, CFS throttling,
  # working-set memory and OOM events are invisible -- which is how the
  # async-proxy containers were being throttled ~25% of CFS periods while every
  # application dashboard looked healthy.
  cadvisor:
    # NOTE: ghcr.io, not gcr.io. The gcr.io/cadvisor mirror is stale at v0.55.1,
    # and anything before v0.60.x cannot resolve container layers when Docker uses
    # the containerd image store ("Storage Driver: overlayfs" on Docker Desktop 28),
    # which silently yields a single root-cgroup series and no throttling metrics.
    image: ghcr.io/google/cadvisor:v0.60.6
    ports:
      - "8089:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    command:
      # docker_only keeps cardinality down: only compose containers are exported,
      # not every host cgroup.
      - --docker_only=true
      - --housekeeping_interval=2s
      # store_container_labels MUST be false for the whitelist to take effect --
      # with it true, every compose/image label is exported instead.
      - --store_container_labels=false
      # Whitelist only the compose labels, so Prometheus can promote a stable
      # `service` label (e.g. async-proxy-egress) instead of parsing container names.
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      election-api:
        condition: service_healthy
      election-actors-1:
        condition: service_healthy
      election-actors-2:
        condition: service_healthy
      async-proxy-ingress:
        condition: service_healthy
      async-proxy-egress:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/provisioning/dashboards/election-system-dashboard.json"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger

  k6:
    image: grafana/k6:0.52.0
    profiles: ["load"]
    environment: &k6-env
      API_URL: "http://election-api:8080"
      ELECTION_ID: "national-2026"
      STAGE_1_VUS: "${STAGE_1_VUS:-50}"
      STAGE_1_DURATION: "${STAGE_1_DURATION:-20s}"
      STAGE_2_VUS: "${STAGE_2_VUS:-150}"
      STAGE_2_DURATION: "${STAGE_2_DURATION:-40s}"
      STAGE_3_VUS: "${STAGE_3_VUS:-300}"
      STAGE_3_DURATION: "${STAGE_3_DURATION:-45s}"
      STAGE_4_VUS: "${STAGE_4_VUS:-500}"
      STAGE_4_DURATION: "${STAGE_4_DURATION:-45s}"
      STAGE_5_DURATION: "${STAGE_5_DURATION:-15s}"
      SLEEP_S: "${SLEEP_S:-0.001}"
      VOTER_SLEEP_S: "${VOTER_SLEEP_S:-0.001}"
      OBSERVER_SLEEP_S: "${OBSERVER_SLEEP_S:-0.1}"
      REQ_TIMEOUT: "${REQ_TIMEOUT:-5s}"
      LOAD_TYPE: "${LOAD_TYPE:-vus}"
      STAGE_1_RATE: "${STAGE_1_RATE:-2000}"
      STAGE_2_RATE: "${STAGE_2_RATE:-5000}"
      STAGE_3_RATE: "${STAGE_3_RATE:-8000}"
      STAGE_4_RATE: "${STAGE_4_RATE:-12000}"
      MAX_VUS: "${MAX_VUS:-3500}"
    volumes:
      - ./observability/k6:/scripts:ro
    command: ["run", "/scripts/election_load.js"]
    depends_on:
      election-api:
        condition: service_healthy

  k6-1:
    image: grafana/k6:0.52.0
    profiles: ["load"]
    environment:
      <<: *k6-env
    volumes:
      - ./observability/k6:/scripts:ro
    command: ["run", "--execution-segment", "0:1/2", "/scripts/election_load.js"]
    depends_on:
      election-api:
        condition: service_healthy

  k6-2:
    image: grafana/k6:0.52.0
    profiles: ["load"]
    environment:
      <<: *k6-env
    volumes:
      - ./observability/k6:/scripts:ro
    command: ["run", "--execution-segment", "1/2:1", "/scripts/election_load.js"]
    depends_on:
      election-api:
        condition: service_healthy
