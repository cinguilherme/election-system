services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: election
      POSTGRES_PASSWORD: election
      POSTGRES_DB: election_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U election -d election_db"]
      interval: 2s
      timeout: 3s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  async-proxy-ingress:
    build:
      context: ..
      dockerfile: d-core-async-proxy/Dockerfile
    environment:
      PORT: "4000"
      GRPC_PORT: "50051"
      BROKER_BACKEND: "jetstream"
      NATS_URL: "nats://nats:4222"
      OTEL_SERVICE_NAME: "async-proxy-ingress"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
      OTEL_SAMPLING_RATIO: "0.10"
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=1 -XX:MaxRAMPercentage=75.0"
    ports:
      - "4000:4000"
      - "50051:50051"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4000 && exec 4<>/dev/tcp/127.0.0.1/50051"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      - nats
      - jaeger
    cap_add:
      - SYS_PTRACE
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1024M

  async-proxy-egress:
    build:
      context: ..
      dockerfile: d-core-async-proxy/Dockerfile
    environment:
      PORT: "4001"
      GRPC_PORT: "50052"
      BROKER_BACKEND: "jetstream"
      NATS_URL: "nats://nats:4222"
      OTEL_SERVICE_NAME: "async-proxy-egress"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
      OTEL_SAMPLING_RATIO: "0.10"
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=1 -XX:MaxRAMPercentage=75.0"
    ports:
      - "4001:4001"
      - "50052:50052"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4001 && exec 4<>/dev/tcp/127.0.0.1/50052"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      - nats
      - jaeger
    cap_add:
      - SYS_PTRACE
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1024M

  election-actors:
    build:
      context: ..
      dockerfile: election-system/Dockerfile
    environment:
      ROLE: "actors"
      METRICS_PORT: "8081"
      ASYNC_PROXY_HOST: "async-proxy-egress"
      ASYNC_PROXY_GRPC_PORT: "50052"
      WORKER_COUNT: "4"
      BATCH_SIZE: "50"
      FLUSH_EVERY_N: "5"
      TICK_INTERVAL_MS: "2000"
      ELECTION_ID: "national-2026"
      DB_ENGINE: "postgres"
      JDBC_URL: "jdbc:postgresql://postgres:5432/election_db"
      DB_USER: "election"
      DB_PASSWORD: "election"
      DB_POOL_SIZE: "8"
      OTEL_SERVICE_NAME: "election-actors"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
      OTEL_SAMPLING_RATIO: "0.10"
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=1 -XX:MaxRAMPercentage=75.0"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      async-proxy-egress:
        condition: service_healthy
      jaeger:
        condition: service_started
    cap_add:
      - SYS_PTRACE
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1536M

  election-api:
    build:
      context: ..
      dockerfile: election-system/Dockerfile
    environment:
      ROLE: "api"
      HTTP_PORT: "8080"
      ASYNC_PROXY_HOST: "async-proxy-ingress"
      ASYNC_PROXY_GRPC_PORT: "50051"
      WORKER_COUNT: "4"
      DB_ENGINE: "postgres"
      JDBC_URL: "jdbc:postgresql://postgres:5432/election_db"
      DB_USER: "election"
      DB_PASSWORD: "election"
      DB_POOL_SIZE: "2"
      OTEL_SERVICE_NAME: "election-api"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
      OTEL_SAMPLING_RATIO: "0.10"
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=1 -XX:MaxRAMPercentage=75.0"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      async-proxy-ingress:
        condition: service_healthy
      election-actors:
        condition: service_healthy
      jaeger:
        condition: service_started
    cap_add:
      - SYS_PTRACE
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1536M

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - MEMORY_MAX_TRACES=5000
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1024M

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      election-api:
        condition: service_healthy
      election-actors:
        condition: service_healthy
      async-proxy-ingress:
        condition: service_healthy
      async-proxy-egress:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/provisioning/dashboards/election-system-dashboard.json"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger

  k6:
    image: grafana/k6:0.52.0
    profiles: ["load"]
    environment:
      API_URL: "http://election-api:8080"
      ELECTION_ID: "national-2026"
    volumes:
      - ./observability/k6:/scripts:ro
    command: ["run", "/scripts/election_load.js"]
    depends_on:
      election-api:
        condition: service_healthy
