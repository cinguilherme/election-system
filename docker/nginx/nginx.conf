user nginx;
# One worker per core of the quota below. `auto` gave 4 workers on a 0.25 CPU
# limit, so they spent their time fighting each other and being throttled --
# measured at 10 throttled periods/s, i.e. effectively 100% of the time. This is
# the LB in front of the whole API tier, so it capped every load test.
worker_processes 2;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time" '
                    'upstream=$upstream_addr';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    upstream election_api_backend {
        least_conn;
        server election-api-1:8080 max_fails=3 fail_timeout=10s;
        server election-api-2:8080 max_fails=3 fail_timeout=10s;
        keepalive 512;
    }

    server {
        listen 8080;
        server_name _;
        keepalive_requests 100000;
        keepalive_timeout 75s;

        location / {
            proxy_pass http://election_api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;

            # Buffer settings for fast throughput under load
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
