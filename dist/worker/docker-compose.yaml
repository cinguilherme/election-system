# Core: broker, lease store, database, proxies, actors, API
#
#   docker compose -f docker-compose.yaml -f docker-compose.observability.yaml up -d

services:

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  # Partition ownership leases.
  #
  # Small on purpose: it holds one short-TTL key per partition and nothing else.
  # Two flags are not defaults and must stay:
  #   --maxmemory-policy noeviction : the fencing counter must never be evicted.
  #     Evicting it would let the epoch regress, so a stale owner could pass the
  #     fence check and overwrite the current owner's state.
  #   --appendonly yes              : so a restart does not reset the same counter.
  # Combined with a named volume, the epoch survives both a valkey restart and a
  # redeploy.

  valkey:
    image: valkey/valkey:8-alpine
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 128M

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: election
      POSTGRES_PASSWORD: election
      POSTGRES_DB: election_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U election -d election_db"]
      interval: 2s
      timeout: 3s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  async-proxy:
    image: ${REGISTRY:?set REGISTRY in .env -- the LAN address of the registry host, e.g. 192.168.15.29:5001}/election-system-async-proxy:${TAG:-latest}
    environment:
      PORT: "4000"
      GRPC_PORT: "50051"
      BROKER_BACKEND: "jetstream"
      NATS_URL: "nats://nats:4222"
      OTEL_SERVICE_NAME: "async-proxy"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
      OTEL_SAMPLING_RATIO: "${OTEL_SAMPLING_RATIO:-0.05}"
      # General purpose: the same gRPC service answers publish and subscribe, so
      # every replica may serve either role -- and must therefore validate lease
      # ownership. Fail-closed: if the lease store is unreachable the
      # subscription is refused rather than two nodes consuming one partition.
      LEASE_VALIDATION: "1"
      OWNERSHIP_ASSIGNMENT: "external"
      VALKEY_URI: "redis://valkey:6379"
      # 60% keeps worst-case RSS under the cgroup limit (see the ingress/egress
      # history: 75% of 1024 MiB left too little for non-heap and got OOM-killed).
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=1 -XX:MaxRAMPercentage=60.0"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4000 && exec 4<>/dev/tcp/127.0.0.1/50051"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 60s
    depends_on:
      - nats
      - valkey
    cap_add:
      - SYS_PTRACE
      # PERFMON is required for `asprof -e cpu` (perf_events sampling).
      - PERFMON
    deploy:
      replicas: ${PROXY_REPLICAS:-3}
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M

  # One endpoint per client-facing port, N identical proxies behind it. Clients
  # keep using the async-proxy-ingress / async-proxy-egress names -- the aliases
  # below make them resolve here -- so replicating the data plane is invisible
  # upstream. "Ingress" and "egress" exist only as two listeners on this
  # container; the proxies themselves are general purpose.

  async-proxy-gateway:
    image: ${REGISTRY:?set REGISTRY in .env -- the LAN address of the registry host, e.g. 192.168.15.29:5001}/election-system-proxy-gateway:${TAG:-latest}
    ports:
      - "50051:50051"
      - "50052:50052"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      async-proxy:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # The LB parses every unary publish (HTTP/2), so this is CPU, not bandwidth.
          cpus: "2.00"
          memory: 256M
    networks:
      default:
        aliases:
          - async-proxy-ingress
          - async-proxy-egress

  election-actors:
    image: ${REGISTRY:?set REGISTRY in .env -- the LAN address of the registry host, e.g. 192.168.15.29:5001}/election-system:${TAG:-latest}
    environment:
      ROLE: "actors"
      METRICS_PORT: "8081"
      ASYNC_PROXY_HOST: "async-proxy-egress"
      ASYNC_PROXY_GRPC_PORT: "50052"
      # Partition ownership. Each scaled replica uses its container HOSTNAME as
      # INSTANCE_ID, registers a heartbeat in Valkey, and claims its rendezvous
      # share of TOTAL_PARTITIONS guarded by per-partition Valkey leases.
      OWNERSHIP_ENABLED: "true"
      OWNERSHIP_GROUP: "actors"
      VALKEY_URI: "redis://valkey:6379"
      LEASE_TTL_MS: "15000"
      DRAIN_TIMEOUT_MS: "20000"
      TOTAL_PARTITIONS: "${TOTAL_PARTITIONS:-32}"
      ACTORS_REPLICAS: "${ACTORS_REPLICAS:-3}"
      WORKER_COUNT: "4"
      # Batch/write policy. BATCH_SIZE is a floor that a busy precinct may not
      # reach; TICK_MIN_BATCH stops the periodic tick from manufacturing tiny
      # batches (measured: 6.44 ballots per statement vs batch-size 50, i.e. 13%
      # of intended size) and TICK_MAX_AGE_MS is the real staleness bound.
      BATCH_SIZE: "200"
      FLUSH_EVERY_N: "50"
      TICK_INTERVAL_MS: "2000"
      TICK_MIN_BATCH: "200"
      TICK_MAX_AGE_MS: "10000"
      ELECTION_ID: "national-2026"
      DB_ENGINE: "postgres"
      JDBC_URL: "jdbc:postgresql://postgres:5432/election_db"
      DB_USER: "election"
      DB_PASSWORD: "election"
      DB_POOL_SIZE: "16"
      # Snapshots are full-state writes on the same pool as the ballot batches;
      # at every-500-messages they were the largest inline-effect tail measured
      # (~9s p99). 2000 trades a little replay on restart for far fewer writes.
      SNAPSHOT_EVERY_N: "2000"
      # Coalesce precinct->tally deltas at most every 200ms.
      TELL_INTERVAL_MS: "200"
      # Even distribution: derived automatically as ceil(TOTAL_PARTITIONS / ACTORS_REPLICAS)
      # unless overridden by MAX_PARTITIONS_PER_INSTANCE.
      # A survivor may exceed this for the grace window (so a failure does not
      # leave shards unowned), then forgoes the excess; the hold-off stops a
      # forgoed partition bouncing straight back to the node that gave it up.
      MAX_PARTITIONS_PER_INSTANCE: "${MAX_PARTITIONS_PER_INSTANCE:-}"
      LEADERSHIP_GRACE_MS: "60000"
      LEADERSHIP_HOLD_OFF_MS: "3000"
      OTEL_SERVICE_NAME: "election-actors"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
      OTEL_SAMPLING_RATIO: "${OTEL_SAMPLING_RATIO:-0.05}"
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=1 -XX:MaxRAMPercentage=75.0"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      async-proxy-gateway:
        condition: service_healthy
    cap_add:
      - SYS_PTRACE
      # PERFMON is required for `asprof -e cpu` (perf_events sampling).
      # Without it perf_event_open fails with EPERM and async-profiler has to
      # fall back to ctimer/itimer, which under-samples worker threads.
      - PERFMON
    deploy:
      replicas: ${ACTORS_REPLICAS:-3}
      resources:
        limits:
          cpus: "1.00"
          memory: 1536M

  election-api-backend:
    image: ${REGISTRY:?set REGISTRY in .env -- the LAN address of the registry host, e.g. 192.168.15.29:5001}/election-system:${TAG:-latest}
    environment:
      ROLE: "api"
      HTTP_PORT: "8080"
      ASYNC_PROXY_HOST: "async-proxy-ingress"
      ASYNC_PROXY_GRPC_PORT: "50051"
      WORKER_COUNT: "8"
      TOTAL_PARTITIONS: "${TOTAL_PARTITIONS:-32}"
      DB_ENGINE: "postgres"
      JDBC_URL: "jdbc:postgresql://postgres:5432/election_db"
      DB_USER: "election"
      DB_PASSWORD: "election"
      DB_POOL_SIZE: "8"
      # Jetty request threads. At 120/node the API saturated with in-flight
      # pinned at ~117/node (2 nodes => ~234 total) while CPU stayed at ~1% and
      # postgres at 0.2% throttle -- i.e. requests queued for a thread, not for a
      # resource. Raised so the pool stops being the binding constraint.
      JETTY_MAX_THREADS: "400"
      OTEL_SERVICE_NAME: "election-api"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
      OTEL_SAMPLING_RATIO: "${OTEL_SAMPLING_RATIO:-0.05}"
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=1 -XX:MaxRAMPercentage=60.0"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      async-proxy-gateway:
        condition: service_healthy
      election-actors:
        condition: service_healthy
    cap_add:
      - SYS_PTRACE
      # PERFMON is required for `asprof -e cpu` (perf_events sampling).
      # Without it perf_event_open fails with EPERM and async-profiler has to
      # fall back to ctimer/itimer, which under-samples worker threads.
      - PERFMON
    deploy:
      replicas: ${API_REPLICAS:-3}
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M

  election-api:
    image: ${REGISTRY:?set REGISTRY in .env -- the LAN address of the registry host, e.g. 192.168.15.29:5001}/election-system-api-lb:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      election-api-backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Proxying is CPU, not bandwidth: 0.25 cores throttled this nginx
          # permanently and capped the API tier regardless of backend capacity.
          cpus: "2.00"
          memory: 256M

volumes:
  valkey-data:
  postgres-data:
