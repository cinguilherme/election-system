<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Container Box -->
  <rect x="15" y="15" width="970" height="650" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Header Banner -->
  <g transform="translate(40, 45)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="24" rx="12" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#10b981"/>
    <text x="24" y="16" fill="#34d399" font-size="11" font-weight="700" letter-spacing="0.5">LOAD TEST VERIFIED: >20x GAIN</text>

    <!-- Title & Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-size="20" font-weight="800" letter-spacing="-0.5">Election System Architecture &amp; DB Write Compression</text>
    <text x="0" y="74" fill="#94a3b8" font-size="13">High-throughput ingestion (3,000–5,000 req/s) collapsed to ~25 SQL stmts/s in PostgreSQL</text>

    <!-- Badges Right -->
    <rect x="680" y="15" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="692" y="32" fill="#94a3b8" font-size="11" font-family="monospace">NATS + Valkey</text>
    <rect x="820" y="15" width="100" height="26" rx="6" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>
    <text x="832" y="32" fill="#c084fc" font-size="11" font-weight="600" font-family="monospace">d-core actors</text>
  </g>

  <!-- Divider -->
  <line x1="40" y1="135" x2="960" y2="135" stroke="#1e293b" stroke-width="1.5"/>

  <!-- ==================== TIER 1: INGRESS & API ==================== -->
  <g transform="translate(40, 155)">
    <rect x="0" y="0" width="205" height="380" rx="12" fill="#0b1329" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="14" y="24" fill="#60a5fa" font-size="11" font-weight="800" letter-spacing="0.5">1. INGRESS &amp; API TIER</text>

    <!-- Client Box -->
    <rect x="12" y="38" width="181" height="90" rx="8" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="24" y="60" fill="#f8fafc" font-size="12" font-weight="700">k6 Load Generators</text>
    <text x="24" y="77" fill="#94a3b8" font-size="11">3,000 - 5,000+ votes/s</text>
    <rect x="24" y="88" width="155" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="32" y="104" fill="#60a5fa" font-size="10" font-family="monospace">POST /elections/:id/votes</text>

    <!-- Arrow down -->
    <line x1="102" y1="130" x2="102" y2="152" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="110" y="145" fill="#94a3b8" font-size="9">Nginx :8080</text>

    <!-- API Replicas Box -->
    <rect x="12" y="156" width="181" height="110" rx="8" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="24" y="178" fill="#f8fafc" font-size="12" font-weight="700">election-api (3x)</text>
    <text x="24" y="195" fill="#94a3b8" font-size="11">Jetty (400 threads/node)</text>
    <text x="24" y="210" fill="#34d399" font-size="11" font-weight="600">✓ Fast HTTP 202 Accepted</text>
    <rect x="24" y="222" width="155" height="26" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="32" y="238" fill="#38bdf8" font-size="10" font-family="monospace">gRPC Unary Publish</text>

    <!-- Read note -->
    <rect x="12" y="280" width="181" height="85" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#334155"/>
    <text x="22" y="300" fill="#f8fafc" font-size="11" font-weight="700">Actor-First Reads</text>
    <text x="22" y="318" fill="#94a3b8" font-size="10">GET /tally queries actor</text>
    <text x="22" y="333" fill="#94a3b8" font-size="10">state directly in ~0.1ms</text>
    <text x="22" y="350" fill="#34d399" font-size="10" font-weight="700">★ 0 SQL reads on DB</text>
  </g>

  <!-- ==================== TIER 2: BROKER & LEASES ==================== -->
  <g transform="translate(265, 155)">
    <rect x="0" y="0" width="215" height="380" rx="12" fill="#061a14" stroke="#065f46" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="14" y="24" fill="#34d399" font-size="11" font-weight="800" letter-spacing="0.5">2. BROKER &amp; LEASES</text>

    <!-- Async Proxy Gateway -->
    <rect x="12" y="38" width="191" height="100" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <text x="24" y="60" fill="#f8fafc" font-size="12" font-weight="700">async-proxy (3x)</text>
    <text x="24" y="77" fill="#94a3b8" font-size="11">gRPC Gateway :50051/:50052</text>
    <text x="24" y="93" fill="#94a3b8" font-size="10">Bounded queues (10k)</text>
    <text x="24" y="108" fill="#94a3b8" font-size="10">Credit-based fetch rate</text>
    <text x="24" y="125" fill="#34d399" font-size="10" font-weight="600">✓ Decoupled ingestion</text>

    <!-- Arrow down -->
    <line x1="107" y1="140" x2="107" y2="162" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- NATS JetStream -->
    <rect x="12" y="165" width="191" height="90" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <text x="24" y="187" fill="#f8fafc" font-size="12" font-weight="700">NATS JetStream 2.10</text>
    <text x="24" y="204" fill="#94a3b8" font-size="11">Stream: proxy_election_votes</text>
    <rect x="24" y="215" width="165" height="26" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="32" y="232" fill="#34d399" font-size="10" font-family="monospace">32 Shards (p00 - p31)</text>

    <!-- Valkey Leases -->
    <rect x="12" y="270" width="191" height="95" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <text x="24" y="292" fill="#f8fafc" font-size="12" font-weight="700">Valkey 8 Leases</text>
    <text x="24" y="309" fill="#94a3b8" font-size="10">Rendezvous consistent hashing</text>
    <text x="24" y="324" fill="#94a3b8" font-size="10">TTL 15s, renewed at TTL/3</text>
    <text x="24" y="340" fill="#a78bfa" font-size="10" font-weight="600">Monotonic Fencing Counter</text>
    <text x="24" y="354" fill="#94a3b8" font-size="9">--maxmemory-policy noeviction</text>
  </g>

  <!-- ==================== TIER 3: ACTOR SYSTEM ==================== -->
  <g transform="translate(500, 155)">
    <rect x="0" y="0" width="225" height="380" rx="12" fill="#160d29" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="14" y="24" fill="#c084fc" font-size="11" font-weight="800" letter-spacing="0.5">3. STATEFUL ACTOR TIER</text>

    <!-- Precinct Actor -->
    <rect x="12" y="38" width="201" height="175" rx="8" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="135" y="44" width="70" height="18" rx="4" fill="#8b5cf6"/>
    <text x="140" y="56" fill="#ffffff" font-size="9" font-weight="700">LEVER 1 &amp; 2</text>

    <text x="24" y="62" fill="#f8fafc" font-size="13" font-weight="700">:precinct Actors</text>
    <text x="24" y="78" fill="#94a3b8" font-size="11">250 instances across 3 nodes</text>

    <line x1="24" y1="88" x2="195" y2="88" stroke="#334155" stroke-width="1"/>

    <text x="24" y="104" fill="#34d399" font-size="11" font-weight="600">✓ O(1) in-memory dedup</text>
    <text x="36" y="118" fill="#94a3b8" font-size="10">Zero SELECT queries on DB</text>

    <text x="24" y="136" fill="#f8fafc" font-size="11" font-weight="600">✓ 200-Ballot Batch Buffer</text>
    <text x="36" y="150" fill="#94a3b8" font-size="10">BATCH_SIZE: 200 floor</text>
    <text x="36" y="163" fill="#94a3b8" font-size="10">TICK_MAX_AGE: 10s bound</text>

    <text x="24" y="182" fill="#c084fc" font-size="11" font-weight="600">✓ Off-Hotpath Tally</text>
    <text x="36" y="196" fill="#94a3b8" font-size="10">Cuts ~52% of SQL statements</text>

    <!-- Arrow down -->
    <line x1="112" y1="215" x2="112" y2="238" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <text x="120" y="230" fill="#a78bfa" font-size="9">Coalesced tells (200ms)</text>

    <!-- Election Tally Parent Actor -->
    <rect x="12" y="242" width="201" height="120" rx="8" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="135" y="248" width="70" height="18" rx="4" fill="#8b5cf6"/>
    <text x="145" y="260" fill="#ffffff" font-size="9" font-weight="700">LEVER 5</text>

    <text x="24" y="266" fill="#f8fafc" font-size="13" font-weight="700">:election-tally</text>
    <text x="24" y="283" fill="#94a3b8" font-size="11">Parent National Aggregator</text>
    <text x="24" y="303" fill="#94a3b8" font-size="10">• In-memory national total</text>
    <text x="24" y="319" fill="#94a3b8" font-size="10">• Merges candidate vote deltas</text>
    <text x="24" y="335" fill="#f59e0b" font-size="10" font-weight="700">• Flushes every 50 deltas</text>
    <text x="24" y="350" fill="#94a3b8" font-size="9">No row-lock contention in DB</text>
  </g>

  <!-- ==================== TIER 4: DATABASE TIER ==================== -->
  <g transform="translate(745, 155)">
    <rect x="0" y="0" width="215" height="380" rx="12" fill="#1f1606" stroke="#78350f" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="14" y="24" fill="#fbbf24" font-size="11" font-weight="800" letter-spacing="0.5">4. POSTGRESQL 16</text>

    <!-- Ballots Table -->
    <rect x="12" y="38" width="191" height="135" rx="8" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2"/>
    <text x="24" y="62" fill="#f8fafc" font-size="13" font-weight="700">ballots table</text>
    <text x="24" y="78" fill="#94a3b8" font-size="11">Append-only immutable receipts</text>

    <rect x="24" y="88" width="167" height="38" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="32" y="103" fill="#34d399" font-size="10" font-weight="700">1 stmt / 200 ballots</text>
    <text x="32" y="117" fill="#94a3b8" font-size="9" font-family="monospace">sql/insert-batch!</text>

    <text x="24" y="145" fill="#34d399" font-size="12" font-weight="800">~15 stmts/s</text>
    <text x="100" y="145" fill="#94a3b8" font-size="10">for 3,000 req/s</text>
    <text x="24" y="162" fill="#94a3b8" font-size="9">UNIQUE (election, precinct, voter)</text>

    <!-- Tallies Table -->
    <rect x="12" y="195" width="191" height="110" rx="8" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="24" y="217" fill="#f8fafc" font-size="13" font-weight="700">election_tallies</text>
    <text x="24" y="233" fill="#94a3b8" font-size="11">Fenced Summary Upsert</text>
    <text x="24" y="252" fill="#34d399" font-size="12" font-weight="800">~2-4 upserts/s</text>
    <text x="110" y="252" fill="#94a3b8" font-size="10">total load</text>
    <rect x="24" y="264" width="167" height="28" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="30" y="281" fill="#f59e0b" font-size="9" font-family="monospace">epoch &lt; EXCLUDED.epoch</text>

    <!-- DB Stats -->
    <rect x="12" y="318" width="191" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="22" y="335" fill="#f8fafc" font-size="10" font-weight="700">PostgreSQL Limits:</text>
    <text x="22" y="350" fill="#94a3b8" font-size="9">0.75 CPU | 16 Conn Pool | 512M RAM</text>
  </g>

  <!-- ==================== FLOW CONNECTIONS BETWEEN TIERS ==================== -->
  <!-- API to Proxy -->
  <line x1="245" y1="230" x2="277" y2="230" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Proxy to Actors -->
  <line x1="480" y1="230" x2="512" y2="230" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  
  <!-- Precinct to DB Ballots (Heavy Compression Arrow) -->
  <line x1="725" y1="120" x2="757" y2="120" stroke="#10b981" stroke-width="4" marker-end="url(#arrow-green)"/>
  <rect x="715" y="90" width="35" height="18" rx="4" fill="#10b981"/>
  <text x="720" y="103" fill="#ffffff" font-size="10" font-weight="800">200:1</text>

  <!-- Tally Actor to DB Tallies -->
  <line x1="725" y1="270" x2="757" y2="270" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== BOTTOM SCOREBOARD CARDS ==================== -->
  <g transform="translate(40, 555)">
    <!-- Scoreboard Container -->
    <rect x="0" y="0" width="920" height="85" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Stat 1 -->
    <g transform="translate(25, 18)">
      <text x="0" y="14" fill="#94a3b8" font-size="11" font-weight="600">INGRESS ARRIVAL RATE</text>
      <text x="0" y="42" fill="#38bdf8" font-size="24" font-weight="800" font-family="monospace">3,000 - 5,187</text>
      <text x="160" y="42" fill="#94a3b8" font-size="12">req/s</text>
      <text x="0" y="58" fill="#64748b" font-size="10">k6 distributed load test</text>
    </g>

    <!-- Divider -->
    <line x1="230" y1="15" x2="230" y2="70" stroke="#1e293b" stroke-width="1"/>

    <!-- Stat 2 -->
    <g transform="translate(255, 18)">
      <text x="0" y="14" fill="#94a3b8" font-size="11" font-weight="600">ACTUAL SQL STATEMENTS</text>
      <text x="0" y="42" fill="#34d399" font-size="24" font-weight="800" font-family="monospace">~17 - 35</text>
      <text x="110" y="42" fill="#94a3b8" font-size="12">stmts/s</text>
      <text x="0" y="58" fill="#64748b" font-size="10">multi-row batch flushes</text>
    </g>

    <!-- Divider -->
    <line x1="470" y1="15" x2="470" y2="70" stroke="#1e293b" stroke-width="1"/>

    <!-- Stat 3 -->
    <g transform="translate(495, 18)">
      <text x="0" y="14" fill="#94a3b8" font-size="11" font-weight="600">WRITE COMPRESSION RATIO</text>
      <text x="0" y="42" fill="#c084fc" font-size="24" font-weight="800" font-family="monospace">> 20x - 60x+</text>
      <text x="0" y="58" fill="#a78bfa" font-size="10" font-weight="600">sum(rows) / sum(statements)</text>
    </g>

    <!-- Divider -->
    <line x1="710" y1="15" x2="710" y2="70" stroke="#1e293b" stroke-width="1"/>

    <!-- Stat 4 -->
    <g transform="translate(735, 18)">
      <text x="0" y="14" fill="#94a3b8" font-size="11" font-weight="600">POSTGRESQL CPU LOAD</text>
      <text x="0" y="42" fill="#34d399" font-size="24" font-weight="800" font-family="monospace">0.38 / 0.75</text>
      <text x="145" y="42" fill="#94a3b8" font-size="12">cores</text>
      <text x="0" y="58" fill="#34d399" font-size="10" font-weight="600">&lt;18% throttling (Quiet)</text>
    </g>
  </g>
</svg>
