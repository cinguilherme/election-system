apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true
    jsonData:
      nodeGraph:
        enabled: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 2000
      # Click a JSON log line and open the trace it belongs to. The matcher is the
      # otelTraceId field the request log emits (hex, sampled requests only).
      derivedFields:
        - name: trace
          matcherType: regex
          matcherRegex: '"otelTraceId":"([a-f0-9]+)"'
          url: '${__value.raw}'
          datasourceUid: jaeger
