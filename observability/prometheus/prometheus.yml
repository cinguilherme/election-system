global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'election-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['election-api-1:8080', 'election-api-2:8080']
        labels:
          tier: 'api'

  - job_name: 'election-actors'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['election-actors:8081']
        labels:
          tier: 'actors'

  - job_name: 'async-proxy-ingress'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['async-proxy-ingress:4000']
        labels:
          tier: 'proxy-ingress'

  - job_name: 'async-proxy-egress'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['async-proxy-egress:4001']
        labels:
          tier: 'proxy-egress'
