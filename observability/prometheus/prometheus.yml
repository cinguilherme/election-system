global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'election-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['election-api-1:8080', 'election-api-2:8080']
        labels:
          tier: 'api'
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+)(?::\d+)?'
        target_label: instance
        replacement: '$1'

  - job_name: 'election-actors'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['election-actors-1:8081', 'election-actors-2:8082']
        labels:
          tier: 'actors'
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+)(?::\d+)?'
        target_label: instance
        replacement: '$1'

  - job_name: 'async-proxy-ingress'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['async-proxy-ingress:4000']
        labels:
          tier: 'proxy-ingress'
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+)(?::\d+)?'
        target_label: instance
        replacement: '$1'

  - job_name: 'async-proxy-egress'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['async-proxy-egress:4001']
        labels:
          tier: 'proxy-egress'
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+)(?::\d+)?'
        target_label: instance
        replacement: '$1'
