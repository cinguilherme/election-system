worker_processes 2;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 16384;
}

# Two listeners, one pool of identical proxies.
#
# The proxies are general purpose -- the same gRPC service answers publish and
# subscribe on the same port -- so "ingress" and "egress" are only a routing
# decision made here, not a property of the proxies. That is why both upstreams
# below point at the same three containers, and why clients can keep using the
# `async-proxy-ingress` / `async-proxy-egress` hostnames (network aliases).
#
# worker_processes 2 against a 2 CPU quota: one worker per core. `auto` gave 4
# workers on a 1 CPU quota (pure contention); dropping to 1 worker removed the
# contention but made a single core the throughput ceiling, which showed up as
# the gateway throttling at ~0.66 cores average while the proxies sat at 0.9
# total. Two and two is the shape that actually uses the quota.

http {
    access_log off;

    # Unary publishes / request-reply. Balanced per RPC, which is what keeps
    # ingress traffic spread when a client reuses one HTTP/2 connection.
    #
    # Passive health only: open-source nginx has no active checks here, so a
    # hard-killed proxy is dropped after max_fails. The proxies share all state
    # in JetStream and the lease store, so either one is equivalent.
    upstream proxies_grpc {
        server async-proxy-1:50051 max_fails=2 fail_timeout=5s;
        server async-proxy-2:50051 max_fails=2 fail_timeout=5s;
        server async-proxy-3:50051 max_fails=2 fail_timeout=5s;
        # Without this nginx opens a NEW HTTP/2 connection to the upstream for
        # every RPC -- a full TCP + HTTP/2 settings handshake per vote. That is
        # not bandwidth or CPU, it is connection churn: measured p50 was 6ms at
        # 50 VUs and 190ms at 500 VUs with zero CPU throttling and everything on
        # localhost, which is the signature of per-request connection setup.
        keepalive 128;
        # Recycle upstream connections well before the proxy would idle them
        # out. A request that lands on a connection the upstream has just closed
        # waits for its deadline instead of failing fast, which is what produced
        # ~4% 5s timeouts on tally reads once keepalive was enabled.
        keepalive_timeout 10s;
        keepalive_requests 1000;
    }

    server {
        listen 50051 http2;
        # Delivery streams are long lived; the 60s default would tear down an
        # idle subscription every minute and force a re-subscribe.
        grpc_read_timeout 1h;
        grpc_send_timeout 1h;
        grpc_socket_keepalive on;

        location / {
            grpc_pass grpc://proxies_grpc;
            # Required for upstream keepalive with grpc_pass: without clearing
            # the Connection header nginx returns the connection per request.
            grpc_set_header Connection "";
            # Retry only on connection errors. `timeout` must NOT be here: the
            # client's deadline is 5s, so retrying a timed-out call keeps nginx
            # working past the deadline the caller already gave up on. Adding it
            # pushed tally-read median from ~375ms to 4.99s.
            grpc_next_upstream error;
        }
    }
}

stream {
    # Delivery streams. Plain TCP on purpose: every ballot message otherwise
    # passes through nginx's HTTP/2 parser and buffers, which is real CPU for a
    # byte-splice. Balancing is per connection, which is exactly right for
    # long-lived streams -- a stream sticks to one proxy for its life, and
    # reconnects are the only rebalancing event.
    upstream proxies_tcp {
        server async-proxy-1:50051 max_fails=2 fail_timeout=5s;
        server async-proxy-2:50051 max_fails=2 fail_timeout=5s;
        server async-proxy-3:50051 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 50052;
        proxy_pass proxies_tcp;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_socket_keepalive on;
    }
}
